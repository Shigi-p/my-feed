# my-feed local config (C0 minimal shape + T-Score knobs)

top_n = 10
default_scorer = "fake"

# Sources enabled for the pipeline. Default stays offline-safe with fake.
# Real adapters (zenn, qiita, gigazine, github_trending) are registered;
# see docs/notes/sources.md for endpoints and an example enabling them.
enabled_sources = ["fake"]

# Scoring parameters (hybrid is the default-candidate strategy for M1).
[scoring.hybrid]
recency_half_life_hours = 36
neutral_popularity_when_missing = 0.5
