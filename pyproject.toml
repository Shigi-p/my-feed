[project]
name = "my-feed"
version = "0.1.0"
description = "Tech catch-up feed: contracts first, parallel tracks later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "feedparser>=6.0.11",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pydantic>=2.11.0",
    "python-multipart>=0.0.32",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
my-feed = "my_feed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_feed"]

[tool.hatch.build.targets.wheel.force-include]
"src/my_feed/web/templates" = "my_feed/web/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: hits live upstream APIs (opt-in via MY_FEED_LIVE=1)",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["scripts/"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (formatterに任せる)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["feedparser", "google.genai"]
ignore_missing_imports = true
