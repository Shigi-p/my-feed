[project]
name = "my-feed"
version = "0.1.0"
description = "Tech catch-up feed: contracts first, parallel tracks later"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
my-feed = "my_feed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_feed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: hits live upstream APIs (opt-in via MY_FEED_LIVE=1)",
]

[tool.uv]
package = true
