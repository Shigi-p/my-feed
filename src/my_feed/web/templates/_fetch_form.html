<form class="fetch-form" method="post" action="/runs">
  <label>
    スコアラー
    <select name="scorer">
      {% set selected = (result.scorer if result else default_scorer) | default("hybrid") %}
      {% for name in scorers %}
      <option value="{{ name }}" {% if name == selected %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit" class="primary">いま取得</button>
</form>
