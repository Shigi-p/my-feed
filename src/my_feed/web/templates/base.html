<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}my feed{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">my feed</a>
      <nav>
        <a href="/" {% if nav == "home" %}aria-current="page"{% endif %}>いま</a>
        <a href="/runs" {% if nav == "runs" %}aria-current="page"{% endif %}>履歴</a>
        <a href="/favorites" {% if nav == "favorites" %}aria-current="page"{% endif %}>お気に入り</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
